title: Corvins Paris-Austausch 2026
latest_post_is_home: true

lang: de
locale: de_DE

fallback-description: Der Blog für die Daheimgebliebenen
home_description: Wöchentliche Updates zu Corvins Erlebnissen in Paris
fallback-image: assets/share-card.jpg

url: https://corvin.sydow.ch
baseurl: /paris2026

preload:
  - href: /fonts/lmsans10-regular.woff2
    as: font
    crossorigin: anonymous
  - href: /fonts/LTSuperiorSerif-Bold.woff2
    as: font
    crossorigin: anonymous

exclude:
  - "*.sh"
  - post-template.md
  - pages/home.md
  - README.md
  - assets/downsized/
  - cache-paths
  - sync-ignore/

defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: post
      permalink: /:short_month-:day:output_ext

picture_tag:
  widths: [480, 960, 1440, 1920]
  quality: 85
  sizes: "(min-width: 1100px) min(60vw, 960px), (min-width: 800px) min(calc(100vw - 280px), 960px), calc(100vw - 40px)"
